<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dynamic Number Generator</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            display: flex;
            min-height: 100vh;
            margin: 0;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            background: #667eea;
            color: #1e293b;
        }
        .card {
            background: #fff;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 { font-size: 1.5rem; }
        #generateBtn {
            font: inherit;
            color: #fff;
            background: #6d28d9;
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
        }
        #generateBtn:hover { background: #7c3aed; }
        #numberList {
            text-align: left;
            margin: 1.25rem 0 0;
            padding-left: 1.5rem;
            min-height: 1.2em;
        }
        #numberList li { padding: 0.2rem 0; }
    </style>
</head>
<body>
    <main class="card">
        <h1>Dynamic Number Generator</h1>
        <button id="generateBtn" type="button">Generate</button>
        <ol id="numberList"></ol>
    </main>

    <!-- Pautan ke fail JavaScript luaran -->
    <script src="script.js"></script>
</body>
</html>
