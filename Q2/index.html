<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Smart Number Validator</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            display: flex;
            min-height: 100vh;
            margin: 0;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            background: #667eea;
            color: #1e293b;
        }
        .card {
            background: #fff;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 { font-size: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 600; }
        #userInput {
            font: inherit;
            width: 100%;
            padding: 0.6rem;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            margin-bottom: 1rem;
            box-sizing: border-box;
        }
        #userInput:focus { outline: 2px solid #6d28d9; border-color: #6d28d9; }
        #checkBtn {
            font: inherit;
            color: #fff;
            background: #6d28d9;
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
        }
        #checkBtn:hover { background: #7c3aed; }
        #result { margin-top: 1rem; font-weight: 600; min-height: 1.2em; }
    </style>
</head>
<body>
    <main class="card">
        <h1>Smart Number Validator</h1>
        <label for="userInput">Enter a number:</label>
        <input type="text" id="userInput" placeholder="Enter a number">
        <button id="checkBtn" type="button">Check</button>
        <p id="result" role="status" aria-live="polite"></p>
    </main>

    <!-- Pautan ke fail JavaScript luaran -->
    <script src="script.js"></script>
</body>
</html>
